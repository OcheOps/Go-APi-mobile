services:
  # The Application
  api:
    build: .
    # We DO NOT expose ports here anymore.
    # The proxy will talk to this service internally on the docker network.
    volumes:
      - ./data:/app/data
    environment:
      - PORT=8080
    restart: always

  # The Reverse Proxy (Caddy)
  proxy:
    image: caddy:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
